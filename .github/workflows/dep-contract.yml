name: dep-contract
# Dependency-upgrade safety net: runs the gate's runtime contract against the
# pinned versions in requirements-dev.txt on EVERY PR — including Renovate's.
# A bump that breaks the lab fails this workflow; roll the version back.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Start mock Ollama (CI has no Metal seam; /api/tags must answer or Nova init fails)
        run: |
          cat > mock_ollama.py <<'EOF'
          import http.server, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/api/tags":
                      body = json.dumps({"models": [{"name": "llama3.2:3b"}]}).encode()
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(body)
                  else:
                      self.send_error(404)

              def log_message(self, *args):
                  pass

          http.server.HTTPServer(("127.0.0.1", 11434), Handler).serve_forever()
          EOF
          nohup python mock_ollama.py &
          sleep 1
          curl -sf http://127.0.0.1:11434/api/tags >/dev/null && echo "mock ollama ready"

      - name: Set up python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependency set (exactly what Renovate bumps)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip show laya nova-hunting fastapi

      - name: Gate contract test (laya + nova-hunting + app import chain)
        env:
          NOVA_RULES_DIR: ${{ github.workspace }}/nova-rules
        run: |
          . .venv/bin/activate
          python scripts/test_gate_contract.py

  docker-build:
    # Catches base-image bumps (Renovate also PRs Dockerfile FROM lines).
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build gate image (python base + laya/nova layer)
        run: docker build -t ai-sec-lab/laya-gate:ci gate/
