name: dep-contract
# Dependency-upgrade safety net. Two surface checks on every PR
# (including Renovate's):
#   gate-contract - the gate's runtime contract (laya verdict matrix,
#     nova-hunting rules + init, app import chain) runs inside the nix
#     devShell, i.e. against the uv.lock materialisation participants get.
#     A bump that breaks the lab fails here; roll the version back.
#   docker-build - Nix builds BOTH container images (the required
#     context keeps its historical name; the builder is Nix).
# The LLM tier is NOT exercised: the Ollama seam (host.orb.internal) does
# not exist on runners; the mock below satisfies Nova's init check.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate-contract:
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Start mock Ollama (CI has no Metal seam; /api/tags must answer or Nova init fails)
        run: |
          cat > mock_ollama.py <<'EOF'
          import http.server, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/api/tags":
                      body = json.dumps({"models": [{"name": "llama3.2:3b"}]}).encode()
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(body)
                  else:
                      self.send_error(404)

              def log_message(self, *args):
                  pass

          http.server.HTTPServer(("127.0.0.1", 11434), Handler).serve_forever()
          EOF
          nohup python3 mock_ollama.py &
          sleep 1
          curl -sf http://127.0.0.1:11434/api/tags >/dev/null && echo "mock ollama ready"

      - name: Gate contract test (laya + nova-hunting + app import chain, from uv.lock)
        env:
          NOVA_RULES_DIR: ${{ github.workspace }}/nova-rules
        run: |
          nix develop --command bash -c '
            python -c "import laya, nova, fastapi; print(\"deps OK\")"
            python scripts/test_gate_contract.py'

  docker-build:
    # Required context name preserved (branch protection). The builder is
    # Nix: streamLayeredImage closures, docker never runs. The victim image
    # is streamed end-to-end as a smoke test (output is a docker-loadable
    # tar; size sanity only).
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build gate image (pinned venv + MiniLM layer + baked rules)
        run: nix build .#packages.x86_64-linux.gate-image -o result-gate

      - name: Build victim image (pinned venv)
        run: nix build .#packages.x86_64-linux.victim-image -o result-victim

      - name: "Smoke: stream victim image as docker-loadable tar"
        run: |
          nix run .#victim-image > /tmp/victim.tar
          test -s /tmp/victim.tar
          du -h /tmp/victim.tar
