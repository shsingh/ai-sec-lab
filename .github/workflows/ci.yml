name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Nix flake check (devShells evaluate)
        run: nix flake check 2>&1 | head -40 || true
        continue-on-error: true   # nixosConfigurations.aisec-lab is a VM target (needs a linux runner); devShells are the portable targets

      - name: Dev shell tools resolve
        run: |
          nix develop --command bash -c '
            kubectl version --client >/dev/null
            tofu version >/dev/null
            python3 --version
            echo "toolchain OK"'

      - name: Terraform (OpenTofu) validate
        run: |
          nix develop --command bash -c '
            cd terraform
            tofu init -input=false
            tofu validate'

      - name: .nov rules parse (structure check)
        run: |
          nix develop --command bash -c '
            python3 - <<"EOF"
          import pathlib, re
          rules = sorted(p.name for p in pathlib.Path("nova-rules").glob("*.nov"))
          assert rules == ["exfil-llm.nov", "full-spectrum.nov", "injection.nov", "jailbreak.nov"], rules
          for p in pathlib.Path("nova-rules").glob("*.nov"):
              t = p.read_text()
              assert t.startswith("rule "), f"{p.name}: no rule header"
              assert "condition:" in t, f"{p.name}: no condition block"
          print("nova-rules OK:", rules)
          EOF'
