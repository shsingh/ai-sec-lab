name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Nix flake check (full evaluation, no builds)
        # Evaluates every output incl. the aarch64 NixOS machine; builds
        # nothing (image/shell builds live in dep-contract).
        run: nix flake check --all-systems --no-build

      - name: Dev shell tools resolve
        run: |
          nix develop --command bash -c '
            kubectl version --client >/dev/null
            tofu version >/dev/null
            python3 --version
            echo "toolchain OK"'

      - name: OpenTofu validate (providers from the committed lock)
        run: |
          nix develop --command bash -c '
            cd terraform
            tofu init -input=false -lockfile=readonly
            tofu validate'

      - name: .nov rules parse (structure check)
        run: |
          nix develop --command bash -c '
            python3 - <<"EOF"
          import pathlib
          rules = sorted(p.name for p in pathlib.Path("nova-rules").glob("*.nov"))
          assert rules == ["exfil-llm.nov", "full-spectrum.nov", "injection.nov", "jailbreak.nov"], rules
          for p in pathlib.Path("nova-rules").glob("*.nov"):
              t = p.read_text()
              assert t.startswith("rule "), f"{p.name}: no rule header"
              assert "condition:" in t, f"{p.name}: no condition block"
          print("nova-rules OK:", rules)
          EOF'
